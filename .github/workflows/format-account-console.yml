name: format account console

on:
  push:
    branches:
      - agent/den-2788-shared-orm-crate
    paths:
      - src/rust-orm/**
      - .github/workflows/format-account-console.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-account-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rustfmt:
    if: github.repository == 'zed-pkg/zed-lib'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' rust_sources < <(find src/rust-orm -type f -name '*.rs' -print0 | sort -z)
          test "${#rust_sources[@]}" -gt 0
          rustfmt --edition 2024 "${rust_sources[@]}"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rust-orm
          git commit -m 'style: apply rustfmt to registry data plane'
          git push origin HEAD:${GITHUB_REF_NAME}
